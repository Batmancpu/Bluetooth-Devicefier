name: Build T700 Companion APK
on:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35 using runner cmdline-tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and assemble T700 Companion
        run: gradle --no-daemon :companion:testDebugUnitTest :companion:assembleDebug
      - name: Verify companion APK signature, alignment and package metadata
        run: |
          APK="companion/build/outputs/apk/debug/companion-debug.apk"
          test -s "$APK"
          SDK_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$SDK_BUILD_TOOLS/apksigner" verify --min-sdk-version 26 --verbose --print-certs "$APK"
          "$SDK_BUILD_TOOLS/zipalign" -c -p 4 "$APK"
          "$SDK_BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|application-label:)"
      - name: Upload companion APK
        uses: actions/upload-artifact@v4
        with:
          name: T700-Companion-0.2.0-debug-APK
          path: companion/build/outputs/apk/debug/companion-debug.apk
          if-no-files-found: error
          retention-days: 30
